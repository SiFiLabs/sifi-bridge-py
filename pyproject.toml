[project]
name = "sifi-bridge-py"
# https://packaging.python.org/en/latest/specifications/version-specifiers/#pre-release-separators
version = "2.0.0"
description = "Python bindings for the SiFi Bridge tool."
authors = [{ name = "SiFi Labs", email = "gabrielg@sifilabs.com" }]
# `sifibridge-bin` bundles the CLI, and its version is the CLI's. The
# wrapper is tested against one release, so allow only patch-level CLI
# fixes to flow through: a new minor can rename flags, which the wrapper
# would not survive (2.0.0 removed `configure imu --gyro-range`).
dependencies = ["numpy", "sifibridge-bin~=2.0.0"]
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
urls = { repository = "https://github.com/SiFiLabs/sifi-bridge-py" }

[project.optional-dependencies]
examples = [
  "matplotlib>=3.9.2",
  "pylsl>=1.16.2",
  "PySide6>=6.7.2",
  "pyqtgraph>=0.13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
sifibridge-bin = { path = "./sifibridge-bin" }
